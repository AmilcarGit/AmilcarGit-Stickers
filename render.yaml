services:
  - type: web
    name: yuiapi-ytdlp
    runtime: python
    plan: free
    rootDir: ytdlp_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: YTDLP_SHARED_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
